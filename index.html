<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hackers Sweepstakes</title>
    <style>
        :root { --green: #0a3d1e; --gold: #d4af37; --silver: #bdc3c7; --bronze: #cd7f32; }
        body { font-family: sans-serif; background: #1a3c15; color: #333; margin: 0; }
        header { background: #051a0b; color: white; text-align: center; padding: 20px; border-bottom: 3px solid var(--gold); }
        .tabs { display: flex; justify-content: center; background: rgba(0,0,0,0.2); padding: 10px; gap: 10px; sticky: top; }
        .tab-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: black; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .card { background: white; margin-bottom: 10px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .main-row { display: grid; grid-template-columns: 40px 1fr 60px; padding: 15px; align-items: center; cursor: pointer; }
        .rank { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; background: #eee; }
        .rank-1 { background: var(--gold); } .rank-2 { background: var(--silver); } .rank-3 { background: var(--bronze); color: white; }
        .score { text-align: right; font-weight: bold; font-size: 1.2rem; }
        .picks { display: none; padding: 15px; background: #f0f0f0; border-top: 1px solid #ddd; }
        .picks.active { display: block; }
        .hidden { display: none; }
        .trend { font-size: 0.8rem; margin-left: 5px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 0.8rem; color: #f9e27d;">☁️ Newtown Square: 12°C | Wind: 6 mph E</div>
    <h1>The Hackers Sweepstakes</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab('sweepstakes', this)">SWEEPSTAKES</button>
    <button class="tab-btn" onclick="showTab('major', this)">PRO LEADERBOARD</button>
</div>

<div class="container">
    <div id="sweepstakes" class="content"></div>
    <div id="major" class="content hidden"></div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycby3RukkvX_KyWljSpPCtYhn7SMQzPBT8ChhGrLveq9DULFbWz8KV4_f-XgvWursDJF-zg/execL";

    function showTab(id, el) {
        document.querySelectorAll('.content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        el.classList.add('active');
    }

    async function load() {
        const res = await fetch(API);
        const data = await res.json();
        renderSweep(data.sweepstakes);
        renderMajor(data.major);
    }

    function renderSweep(list) {
        const container = document.getElementById('sweepstakes');
        container.innerHTML = list.map((p, i) => {
            const cur = i + 1;
            const prev = parseInt(p["Previous Rank"]) || cur;
            let trend = `<span class="trend" style="color:gray">▬</span>`;
            if (prev > cur) trend = `<span class="trend" style="color:green">▲${prev-cur}</span>`;
            if (prev < cur) trend = `<span class="trend" style="color:red">▼${cur-prev}</span>`;
            
            return `
                <div class="card">
                    <div class="main-row" onclick="this.nextElementSibling.classList.toggle('active')">
                        <div class="rank ${cur <= 3 ? 'rank-'+cur : ''}">${cur}</div>
                        <div style="padding-left:10px"><b>${p["Entrants Name"]}</b> ${trend}</div>
                        <div class="score">${p["3 Lowest Combined"] > 0 ? '+'+p["3 Lowest Combined"] : (p["3 Lowest Combined"] == 0 ? 'E' : p["3 Lowest Combined"])}</div>
                    </div>
                    <div class="picks">
                        <div>${p["Pick 1"]} (${p["Score 1"]})</div>
                        <div>${p["Pick 2"]} (${p["Score 2"]})</div>
                        <div>${p["Pick 3"]} (${p["Score 3"]})</div>
                    </div>
                </div>`;
        }).join('');
    }

    function renderMajor(list) {
        const container = document.getElementById('major');
        container.innerHTML = list.slice(0,25).map(p => `
            <div class="card" style="padding:15px; display:flex; justify-content:space-between;">
                <b>${p.PLAYER || p.Player}</b> <span>${p.SCORE || p.ToPar}</span>
            </div>`).join('');
    }

    load();
</script>
</body>
</html>
