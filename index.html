<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hackers Sweepstakes</title>
    <style>
        :root {
            --deep-fairway: #0a3d1e;
            --gold-leaf: linear-gradient(145deg, #d4af37, #f9e27d, #b8860b);
            --silver: linear-gradient(145deg, #bdc3c7, #ecf0f1, #95a5a6);
            --bronze: linear-gradient(145deg, #cd7f32, #f5d5b5, #a0522d);
            --glass-white: rgba(255, 255, 255, 0.94);
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: radial-gradient(circle at top, #2d5a27 0%, #1a3c15 100%);
            background-attachment: fixed;
            margin: 0; padding: 0; min-height: 100vh;
        }

        header {
            background: linear-gradient(to bottom, #113318, #051a0b);
            color: #fff; padding: 25px 15px; text-align: center;
            border-bottom: 5px solid #d4af37;
        }

        .weather-bar { font-size: 0.8rem; color: #f9e27d; margin-bottom: 10px; opacity: 0.9; }

        /* Medal Colors */
        .rank-1 { background: var(--gold-leaf) !important; color: #000 !important; }
        .rank-2 { background: var(--silver) !important; color: #000 !important; }
        .rank-3 { background: var(--bronze) !important; color: #000 !important; }

        /* New Design Elements */
        .tap-hint { font-size: 0.65rem; color: #777; text-transform: uppercase; margin-top: 4px; display: block; font-weight: bold; }
        
        .trend-up { color: #2ecc71; font-size: 0.8rem; margin-left: 5px; }
        .trend-down { color: #e74c3c; font-size: 0.8rem; margin-left: 5px; }
        .trend-flat { color: #95a5a6; font-size: 0.8rem; margin-left: 5px; }

        .entrant-card {
            background: var(--glass-white);
            margin-bottom: 12px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow: hidden;
        }

        .main-info { display: grid; grid-template-columns: 60px 1fr 110px; padding: 15px 20px; align-items: center; cursor: pointer; }
        
        .rank { width: 38px; height: 38px; background: #333; color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; }

        .total-score { text-align: right; font-weight: 900; font-size: 1.6rem; }

        /* Tabs Navigation */
        .tabs { display: flex; justify-content: center; background: rgba(0,0,0,0.2); padding: 10px; gap: 10px; }
        .tab-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid #f9e27d; background: transparent; color: #f9e27d; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tab-btn.active { background: #f9e27d; color: #000; }

        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>

<header>
    <div class="weather-bar">⛅ Aronimink GC: 18°C | NW 12km/h</div>
    <h1>The Hackers Sweepstakes</h1>
    <div id="last-updated">Syncing...</div>
</header>

<nav class="tabs">
    <button class="tab-btn active" onclick="showSection('leaderboard-section', this)">Sweepstakes</button>
    <button class="tab-btn" onclick="showSection('stats-section', this)">AI Insights</button>
</nav>

<div class="container" style="max-width: 750px; margin: 20px auto; padding: 0 15px;">
    
    <div id="leaderboard-section" class="section active">
        <div id="leaderboard"></div>
    </div>

    <div id="stats-section" class="section">
        <div class="entrant-card" style="padding: 20px; text-align: center;">
            <h3 style="color: var(--deep-fairway)">AI Historical Analysis</h3>
            <p style="font-size: 0.9rem; color: #555;">Loading historical pick data from previous tournaments...</p>
            <div style="background: #f0f4f1; border-radius: 10px; padding: 15px; font-style: italic;">
                "Statistical insight: Based on Aronimink's long par 4s, entrants picking 'Bombers' have a 12% higher historical win rate."
            </div>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby3RukkvX_KyWljSpPCtYhn7SMQzPBT8ChhGrLveq9DULFbWz8KV4_f-XgvWursDJF-zg/exec";

    function showSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    async function fetchLeaderboard() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderUI(data);
            updateTimestamp();
        } catch (err) {
            console.error(err);
        }
    }

    function renderUI(data) {
        const container = document.getElementById('leaderboard');
        container.innerHTML = ""; 

        data.forEach((entrant, index) => {
            const rankNum = index + 1;
            const medalClass = rankNum <= 3 ? `rank-${rankNum}` : "";
            
            // TREND LOGIC: Requires a column in your sheet called "Previous Rank"
            const prevRank = parseInt(entrant["Previous Rank"]) || rankNum;
            let trendHtml = '<span class="trend-flat">▬</span>';
            if (prevRank > rankNum) trendHtml = `<span class="trend-up">▲ ${prevRank - rankNum}</span>`;
            if (prevRank < rankNum) trendHtml = `<span class="trend-down">▼ ${rankNum - prevRank}</span>`;

            const scoreVal = parseInt(entrant["3 Lowest Combined"]) || 0;
            const scoreDisplay = scoreVal > 0 ? `+${scoreVal}` : (scoreVal === 0 ? 'E' : scoreVal);

            const card = document.createElement('div');
            card.className = 'entrant-card';
            card.innerHTML = `
                <div class="main-info" onclick="this.nextElementSibling.classList.toggle('active')">
                    <span class="rank ${medalClass}">${rankNum}</span>
                    <span class="name">
                        ${entrant["Entrants Name"]} ${trendHtml}
                        <span class="tap-hint">Tap to see picks</span>
                    </span>
                    <span class="total-score">${scoreDisplay}</span>
                </div>
                <div class="golfer-details" style="display:none; padding: 15px; background: rgba(0,0,0,0.03);">
                    ${buildGolferList(entrant)}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function buildGolferList(e) {
        const golfers = [
            { n: e["Pick 1"], h: e["Thru 1"], s: e["Score 1"] },
            { n: e["Pick 2"], h: e["Thru 2"], s: e["Score 2"] },
            { n: e["Pick 3"], h: e["Thru 3"], s: e["Score 3"] },
            { n: e["Pick 4"], h: e["Thru 4"], s: e["Score 4"] },
            { n: e["Pick 5"], h: e["Thru 5"], s: e["Score 5"] },
            { n: e["Pick 6"], h: e["Thru 6"], s: e["Score 6"] }
        ];
        return golfers.map(g => g.n ? `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding:5px 0;"><span>${g.n}</span><span>${g.s}</span></div>` : "").join('');
    }

    function updateTimestamp() {
        const now = new Date();
        document.getElementById('last-updated').innerText = `LIVE @ ${now.toLocaleTimeString('en-IE', {timeZone:'Europe/Dublin'})}`;
    }

    fetchLeaderboard();
    setInterval(fetchLeaderboard, 120000);
</script>
</body>
</html>
