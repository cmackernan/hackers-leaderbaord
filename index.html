<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hackers Sweepstakes | Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #103a1f;
            --accent: #d4af37;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; color: #1a1a1a;
            background: linear-gradient(rgba(10, 40, 20, 0.92), rgba(10, 40, 20, 0.92)), 
                        url('https://www.transparenttextures.com/patterns/dark-leather.png'), #103a1f;
            background-attachment: fixed;
        }

        header {
            padding: 35px 20px;
            text-align: center;
            color: white;
            background: radial-gradient(circle at center, #1e4d2b 0%, #051a0b 100%);
            border-bottom: 4px solid var(--accent);
        }

        .weather-chip {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            padding: 12px;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 26, 11, 0.9);
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .tab-btn.active { background: var(--accent); color: #000; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .card {
            background: var(--glass);
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Leaderboard Header Row */
        .list-header {
            display: grid;
            grid-template-columns: 40px 1fr 60px 70px;
            padding: 10px 15px;
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-main {
            display: grid;
            grid-template-columns: 50px 1fr 80px;
            padding: 18px;
            align-items: center;
            cursor: pointer;
        }

        .rank-circle {
            width: 38px; height: 38px;
            background: #222; color: #fff;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
        }

        .gold { background: linear-gradient(135deg, #d4af37, #f9e27d); color: #000; }
        .silver { background: #bdc3c7; color: #000; }
        .bronze { background: #cd7f32; color: #fff; }

        .name-stack { padding-left: 15px; }
        .name-primary { font-weight: 800; font-size: 1.1rem; }
        .score-total { text-align: right; font-weight: 900; font-size: 1.5rem; color: #103a1f; }

        /* Picks Section Improvement */
        .picks-area {
            display: none;
            padding: 15px;
            background: rgba(0,0,0,0.03);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .picks-area.active { display: block; }

        .pick-row {
            display: grid;
            grid-template-columns: 1fr 60px 50px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .pro-card {
            display: grid;
            grid-template-columns: 40px 1fr 60px 70px;
            padding: 15px;
            align-items: center;
            font-weight: 700;
        }

        .trend { font-size: 0.8rem; margin-left: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <div class="weather-chip">⛅ ARONIMINK GC: 12°C | 6MPH</div>
    <h1 style="margin: 0; font-size: 2rem; font-weight: 900;">HACKERS <span style="color: var(--accent)">LEADERBOARD</span></h1>
</header>

<nav class="tabs">
    <button class="tab-btn active" onclick="toggleTab('sweepstakes', this)">Sweepstakes</button>
    <button class="tab-btn" onclick="toggleTab('major', this)">Pro Live</button>
</nav>

<div class="container">
    <div id="sweepstakes-view" class="view-content"></div>
    
    <div id="major-view" class="view-content hidden">
        <div class="list-header">
            <span>Pos</span><span>Player</span><span>Thru</span><span style="text-align:right">Score</span>
        </div>
        <div id="major-list"></div>
    </div>
</div>

<script>
    // --- INSERT YOUR URL BELOW ---
    const API_URL = "REPLACE_WITH_YOUR_DEPLOYED_URL";

    function toggleTab(view, btn) {
        document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(view + '-view').classList.remove('hidden');
        btn.classList.add('active');
    }

    async function fetchScores() {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderSweep(data.sweepstakes);
        renderMajor(data.major);
    }

    function renderSweep(data) {
        const container = document.getElementById('sweepstakes-view');
        container.innerHTML = data.map((p, i) => {
            const rank = i + 1;
            const prev = parseInt(p["Previous Rank"]) || rank;
            const medal = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
            
            let trend = `<span class="trend" style="color:#aaa">▬</span>`;
            if (prev > rank) trend = `<span class="trend" style="color:#27ae60">▲${prev-rank}</span>`;
            if (prev < rank) trend = `<span class="trend" style="color:#e74c3c">▼${rank-prev}</span>`;

            return `
                <div class="card">
                    <div class="card-main" onclick="this.nextElementSibling.classList.toggle('active')">
                        <div class="rank-circle ${medal}">${rank}</div>
                        <div class="name-stack">
                            <div class="name-primary">${p["Entrants Name"]} ${trend}</div>
                            <div style="font-size:0.6rem; color:#888; font-weight:bold; text-transform:uppercase;">Tap to see picks</div>
                        </div>
                        <div class="score-total">${p["3 Lowest Combined"] > 0 ? '+'+p["3 Lowest Combined"] : (p["3 Lowest Combined"] == 0 ? "E" : p["3 Lowest Combined"])}</div>
                    </div>
                    <div class="picks-area">
                        <div class="pick-row" style="color:var(--accent); font-size:0.65rem; border-bottom:2px solid #ddd;">
                            <span>GOLFER</span><span>THRU</span><span style="text-align:right">SCORE</span>
                        </div>
                        ${renderPickRow(p["Pick 1"], p["Thru 1"], p["Score 1"])}
                        ${renderPickRow(p["Pick 2"], p["Thru 2"], p["Score 2"])}
                        ${renderPickRow(p["Pick 3"], p["Thru 3"], p["Score 3"])}
                        ${renderPickRow(p["Pick 4"], p["Thru 4"], p["Score 4"])}
                        ${renderPickRow(p["Pick 5"], p["Thru 5"], p["Score 5"])}
                        ${renderPickRow(p["Pick 6"], p["Thru 6"], p["Score 6"])}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPickRow(name, thru, score) {
        if (!name) return "";
        return `
            <div class="pick-row">
                <span>${name}</span>
                <span style="color:#666">${thru || '-'}</span>
                <span style="text-align:right; font-weight:800">${score}</span>
            </div>
        `;
    }

    function renderMajor(data) {
        const list = document.getElementById('major-list');
        const players = data.filter(p => p.PLAYER || p.Player);
        list.innerHTML = players.slice(0, 40).map(p => `
            <div class="card pro-card">
                <span style="color:#888">${p.POS || p.Pos || '-'}</span>
                <span style="color:var(--primary)">${p.PLAYER || p.Player}</span>
                <span style="color:#666; font-size:0.8rem;">${p.THRU || p.Thru || '-'}</span>
                <span style="text-align:right; color:#d35400">${p.SCORE || p.ToPar || 'E'}</span>
            </div>
        `).join('');
    }

    fetchScores();
    setInterval(fetchScores, 60000);
</script>
</body>
</html>
