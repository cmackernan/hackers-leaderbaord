<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hackers Sweepstakes Leaderboard</title>
    <style>
        :root {
            --deep-fairway: #0a3d1e;
            --lush-green: #1e5c31;
            --gold-leaf: linear-gradient(145deg, #d4af37, #f9e27d, #b8860b);
            --glass-white: rgba(255, 255, 255, 0.94);
            --text-main: #1a2a1f;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: radial-gradient(circle at top, #2d5a27 0%, #1a3c15 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
        }

        header {
            background: linear-gradient(to bottom, #113318, #051a0b);
            color: #fff;
            padding: 35px 15px;
            text-align: center;
            border-bottom: 5px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-weight: 900; }

        #last-updated {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            color: #f9e27d;
            font-size: 0.8rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .container { max-width: 750px; margin: 30px auto; padding: 0 15px; }

        .entrant-card {
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .main-info { display: grid; grid-template-columns: 60px 1fr 110px; padding: 20px; align-items: center; cursor: pointer; }

        .rank { width: 35px; height: 35px; background: var(--gold-leaf); color: #000; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 900; }

        .name { font-weight: 700; font-size: 1.2rem; padding-left: 10px; color: #0a3d1e; }

        .total-score { text-align: right; font-weight: 900; font-size: 1.5rem; }

        .golfer-details { display: none; background: rgba(255, 255, 255, 0.6); padding: 20px; border-top: 1px solid rgba(0,0,0,0.05); }

        .golfer-details.active { display: block; }

        .golfer-grid { display: grid; grid-template-columns: 1fr 70px 70px; padding: 10px 5px; border-bottom: 1px solid rgba(0,0,0,0.05); }

        .grid-header { font-weight: bold; color: #4a6d54; text-transform: uppercase; font-size: 0.75rem; }

        .score-under { color: #cc0000; font-weight: bold; }
        .score-even { color: #666; font-weight: bold; }
        .score-over { color: #1a2a1f; font-weight: bold; }

        .loader { text-align: center; padding: 100px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>The Hackers Sweepstakes</h1>
    <div id="last-updated">Synchronizing Live Feed...</div>
</header>

<div class="container" id="leaderboard">
    <div class="loader">Fetching Live Scores...</div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby3RukkvX_KyWljSpPCtYhn7SMQzPBT8ChhGrLveq9DULFbWz8KV4_f-XgvWursDJF-zg/exec";

    async function fetchLeaderboard() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderUI(data);
            updateTimestamp();
        } catch (err) {
            console.error("Fetch error:", err);
            document.getElementById('leaderboard').innerHTML = "<div class='loader'>⚠️ Error Loading Scores</div>";
        }
    }

    function updateTimestamp() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-IE', { 
            timeZone: 'Europe/Dublin', 
            hour: '2-digit', minute: '2-digit', hour12: true 
        });
        const dateString = now.toLocaleDateString('en-IE', { 
            timeZone: 'Europe/Dublin', 
            day: 'numeric', month: 'short' 
        });
        document.getElementById('last-updated').innerText = `LIVE: ${dateString} @ ${timeString} Dublin`;
    }

    function renderUI(data) {
        const container = document.getElementById('leaderboard');
        container.innerHTML = ""; 

        data.forEach((entrant, index) => {
            const card = document.createElement('div');
            card.className = 'entrant-card';
            
            const scoreVal = parseInt(entrant["3 Lowest Combined"]) || 0;
            const scoreClass = scoreVal < 0 ? 'score-under' : (scoreVal === 0 ? 'score-even' : 'score-over');
            const scoreDisplay = scoreVal > 0 ? `+${scoreVal}` : (scoreVal === 0 ? 'E' : scoreVal);

            card.innerHTML = `
                <div class="main-info" onclick="this.nextElementSibling.classList.toggle('active')">
                    <span class="rank">${index + 1}</span>
                    <span class="name">${entrant["Entrants Name"]}</span>
                    <span class="total-score ${scoreClass}">${scoreDisplay}</span>
                </div>
                <div class="golfer-details">
                    <div class="golfer-grid grid-header">
                        <span>Golfer</span><span>Thru</span><span>Score</span>
                    </div>
                    ${buildGolferList(entrant)}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function buildGolferList(e) {
        const golfers = [
            { n: e["Pick 1"], h: e["Thru 1"], s: e["Score 1"] },
            { n: e["Pick 2"], h: e["Thru 2"], s: e["Score 2"] },
            { n: e["Pick 3"], h: e["Thru 3"], s: e["Score 3"] },
            { n: e["Pick 4"], h: e["Thru 4"], s: e["Score 4"] },
            { n: e["Pick 5"], h: e["Thru 5"], s: e["Score 5"] },
            { n: e["Pick 6"], h: e["Thru 6"], s: e["Score 6"] }
        ];

        return golfers.map(g => {
            if (!g.n) return "";
            const sInt = parseInt(g.s) || 0;
            const sClass = sInt < 0 ? 'score-under' : (sInt === 0 ? 'score-even' : 'score-over');
            const sDisp = sInt > 0 ? `+${sInt}` : (sInt === 0 ? 'E' : sInt);
            return `
                <div class="golfer-grid">
                    <span style="font-weight:600">${g.n}</span>
                    <span style="color:#666">${g.h || '-'}</span>
                    <span class="${sClass}">${sDisp}</span>
                </div>
            `;
        }).join('');
    }
    
    fetchLeaderboard();
    setInterval(fetchLeaderboard, 120000);
</script>
</body>
</html>
